{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoSolar</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">

  <!-- App CSS -->
  <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <img src="{% static 'main/image/logo_image.png' %}" alt="autosolar" class="brand-icon">
      <img src="{% static 'main/image/logo_letter.png' %}" alt="autosolar" class="brand-letter">
    </div>

    <div class="search">
      <input id="q" class="search-input" type="text" placeholder="주소 또는 지번을 입력하세요">
      <button id="btnSearch" class="btn btn-primary btn-sm">검색</button>
      <button id="btnHelp"   class="btn btn-outline btn-sm">도움말</button>
    </div>

    <label class="chip chip-switch">
      <input type="checkbox" id="chkParcel">
      <span>필지 단위 보기</span>
    </label>
  </header>

  <main class="app-main">
    <!-- Left rail -->
    <aside class="iconbar" id="leftbar">
      <button class="i active" data-tab="filter" title="필터"><i data-lucide="sliders-horizontal"></i></button>
      <button class="i" data-tab="report" title="프로젝트/보고서"><i data-lucide="file-text"></i></button>
      <button class="i" data-tab="db" title="프로젝트 DB"><i data-lucide="database"></i></button>
      <div class="grow"></div>
      <button class="i" data-tab="auth" title="로그인"><i data-lucide="user-round"></i></button>
    </aside>

    <!-- Filters -->
    <aside class="sidebar sidebar-accordion" id="panel-filter">
      <!-- 지목 (기본: 닫힘) -->
      <div class="acc-item" data-key="landuse" style="--chip: var(--c-landuse)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">지목</span>
          <span class="acc-meta">복수 선택</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="60">
            <span class="op-val">60%</span>
          </div>
          <label class="pill"><input type="checkbox" class="opt" value="farmland" data-color="--c-landuse-1">농지</label>
          <label class="pill"><input type="checkbox" class="opt" value="salt"     data-color="--c-landuse-2">염전</label>
          <label class="pill"><input type="checkbox" class="opt" value="fishfarm" data-color="--c-landuse-3">양어장</label>
        </div>
      </div>

      <!-- 용도지역 -->
      <div class="acc-item" data-key="zoning" style="--chip: var(--c-zoning)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">용도지역</span>
          <span class="acc-meta">표시</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="55">
            <span class="op-val">55%</span>
          </div>
        </div>
      </div>

      <!-- 표고 -->
      <div class="acc-item" data-key="elevation" style="--chip: var(--c-elevation)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">표고</span>
          <span class="acc-meta">0 m 기준</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="45">
            <span class="op-val">45%</span>
          </div>
          <div class="acc-row slider">
            <input type="range" class="range val" min="0" max="500" step="10" value="0">
            <span class="muted"><b class="valText">0</b> m 이상만 표시</span>
          </div>
        </div>
      </div>

      <!-- 경사 -->
      <div class="acc-item" data-key="slope" style="--chip: var(--c-slope)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">경사</span>
          <span class="acc-meta">0% 기준</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="45">
            <span class="op-val">45%</span>
          </div>
          <div class="acc-row slider">
            <input type="range" class="range val" min="0" max="50" step="1" value="0">
            <span class="muted"><b class="valText">0</b>% 이하만 표시</span>
          </div>
        </div>
      </div>

      <!-- 생태자연도 -->
      <div class="acc-item" data-key="eco" style="--chip: var(--c-eco)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">생태자연도</span>
          <span class="acc-meta">표시</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="55">
            <span class="op-val">55%</span>
          </div>
        </div>
      </div>

      <!-- 하천 -->
      <div class="acc-item" data-key="river" style="--chip: var(--c-river)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">하천</span>
          <span class="acc-meta">하위 선택</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="60">
            <span class="op-val">60%</span>
          </div>
          <label class="pill"><input type="checkbox" class="opt" value="main"   data-color="--c-river-1">하천</label>
          <label class="pill"><input type="checkbox" class="opt" value="branch" data-color="--c-river-2">소하천</label>
        </div>
      </div>

      <!-- 자연공원 -->
      <div class="acc-item" data-key="park" style="--chip: var(--c-park)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">자연공원</span>
          <span class="acc-meta">표시</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="50">
            <span class="op-val">50%</span>
          </div>
        </div>
      </div>

      <!-- 보호구역 -->
      <div class="acc-item" data-key="protection" style="--chip: var(--c-protection)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">보호구역</span>
          <span class="acc-meta">하위 선택</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="50">
            <span class="op-val">50%</span>
          </div>
          <label class="pill"><input type="checkbox" class="opt" value="water"   data-color="--c-prot-1">상수원</label>
          <label class="pill"><input type="checkbox" class="opt" value="wetland" data-color="--c-prot-2">습지</label>
          <label class="pill"><input type="checkbox" class="opt" value="wild"    data-color="--c-prot-3">야생동물</label>
        </div>
      </div>

      <!-- 문화재 -->
      <div class="acc-item" data-key="heritage" style="--chip: var(--c-heritage)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">문화재</span>
          <span class="acc-meta">표시</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="50">
            <span class="op-val">50%</span>
          </div>
        </div>
      </div>

      <!-- 이격거리 -->
      <div class="acc-item" data-key="buffer" style="--chip: var(--c-buffer)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">이격거리</span>
          <span class="acc-meta">하위 선택</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="55">
            <span class="op-val">55%</span>
          </div>
          <label class="pill"><input type="checkbox" class="opt" value="residential" data-color="--c-buffer-1">주거</label>
          <label class="pill"><input type="checkbox" class="opt" value="road"        data-color="--c-buffer-2">도로</label>
        </div>
      </div>

      <!-- 계통 -->
      <div class="acc-item" data-key="grid" style="--chip: var(--c-grid)">
        <button class="acc-head" type="button" aria-expanded="false">
          <span class="chip-dot" aria-hidden="true"></span>
          <span class="acc-title">계통</span>
          <span class="acc-meta">표시</span>
          <label class="head-switch" title="레이어 켜기">
            <input type="checkbox" class="layer-toggle"><i></i>
          </label>
          <span class="acc-arrow"></span>
        </button>
        <div class="acc-body">
          <div class="acc-row controls">
            <span class="label">투명도</span>
            <input class="range op" type="range" min="0" max="100" value="55">
            <span class="op-val">55%</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Map -->
    <section class="map-wrap">
      <div id="map" class="map-canvas"></div>
      <div class="map-controls">
        <div class="ctrl-stack">
          <button id="btnZoomIn"  class="ctrl">＋</button>
          <button id="btnZoomOut" class="ctrl">－</button>
          <button id="btnLocate"  class="ctrl">📍</button>
        </div>
        <button id="btnPrimaryCTA" class="fab">
          <img class="fab-icon" src="https://unpkg.com/lucide-static@0.447.0/icons/mouse-pointer-click.svg" alt="">
          선택 시작
        </button>
      </div>
    </section>
  </main>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<!-- Lucide -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>

<script>window.VWORLD_API_KEY = "{{ VWORLD_API_KEY }}";</script>

<!-- App JS -->
<script src="{% static 'main/script.js' %}"></script>
</body>
</html>
