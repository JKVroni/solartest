{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoSolar</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <!-- App CSS -->
  <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>
<div class="app">

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <img src="{% static 'main/image/logo.png' %}" alt="autosolar" class="brand-logo">
      <span class="brand-text">autosolar</span>
    </div>

    <div class="search">
      <input id="q" class="search-input" type="text" placeholder="주소 또는 지번을 입력하세요">
      <button id="btnSearch" class="btn btn-primary">검색</button>
      <button id="btnHelp"   class="btn btn-outline">도움말</button>
    </div>

    <!-- 필지 단위 보기 -->
    <label class="chip chip-switch">
      <input type="checkbox" id="chkParcel">
      <span>필지 단위 보기</span>
    </label>
  </header>

  <!-- Main -->
  <main class="app-main">
    <!-- Icon rail -->
    <aside class="iconbar" id="leftbar">
      <button class="i active" data-tab="filter" title="필터">🔎</button>
      <button class="i" data-tab="report" title="프로젝트/보고서">📄</button>
      <button class="i" data-tab="db"     title="프로젝트 DB">📁</button>
      <div class="grow"></div>
      <button class="i" data-tab="auth"   title="로그인">👤</button>
    </aside>

    <!-- Sidebar : FILTERS -->
    <aside class="sidebar" id="panel-filter">
      <!-- 1. 지목 -->
      <section class="card sec" data-key="landuse">
        <div class="card-head">
          <h4>지목</h4>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="60" />
          </div>
        </div>
        <div class="rows">
          <label class="row opt-pill"><input type="checkbox" class="opt" value="farmland" data-color="--c-landuse-1">농지</label>
          <label class="row opt-pill"><input type="checkbox" class="opt" value="salt"     data-color="--c-landuse-2">염전</label>
          <label class="row opt-pill"><input type="checkbox" class="opt" value="fishfarm" data-color="--c-landuse-3">양어장</label>
        </div>
      </section>

      <!-- 2. 용도지역 -->
      <section class="card sec" data-key="zoning">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>용도지역</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="55" />
          </div>
        </div>
      </section>

      <!-- 3. 표고 -->
      <section class="card sec" data-key="elevation">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>표고</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="45" />
          </div>
        </div>
        <div class="row grid2">
          <input type="range" class="range val" min="0" max="500" step="10" value="0" />
          <span><span class="valText">0</span> m 이상만 표시</span>
        </div>
      </section>

      <!-- 4. 경사 -->
      <section class="card sec" data-key="slope">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>경사</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="45" />
          </div>
        </div>
        <div class="row grid2">
          <input type="range" class="range val" min="0" max="50" step="1" value="0" />
          <span><span class="valText">0</span>% 이하만 표시</span>
        </div>
      </section>

      <!-- 5. 생태자연도 -->
      <section class="card sec" data-key="eco">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>생태자연도</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="55" />
          </div>
        </div>
      </section>

      <!-- 6. 하천 -->
      <section class="card sec" data-key="river">
        <div class="card-head">
          <h4>하천</h4>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="60" />
          </div>
        </div>
        <div class="rows">
          <label class="row opt-pill"><input type="checkbox" class="opt" value="main"   data-color="--c-river-1">하천</label>
          <label class="row opt-pill"><input type="checkbox" class="opt" value="branch" data-color="--c-river-2">소하천</label>
        </div>
      </section>

      <!-- 7. 자연공원 -->
      <section class="card sec" data-key="park">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>자연공원</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="50" />
          </div>
        </div>
      </section>

      <!-- 8. 보호구역 -->
      <section class="card sec" data-key="protection">
        <div class="card-head">
          <h4>보호구역</h4>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="50" />
          </div>
        </div>
        <div class="rows">
          <label class="row opt-pill"><input type="checkbox" class="opt" value="water"   data-color="--c-prot-1">상수원</label>
          <label class="row opt-pill"><input type="checkbox" class="opt" value="wetland" data-color="--c-prot-2">습지</label>
          <label class="row opt-pill"><input type="checkbox" class="opt" value="wild"    data-color="--c-prot-3">야생동물</label>
        </div>
      </section>

      <!-- 9. 문화재 -->
      <section class="card sec" data-key="heritage">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>문화재</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="50" />
          </div>
        </div>
      </section>

      <!-- 10. 이격거리 -->
      <section class="card sec" data-key="buffer">
        <div class="card-head">
          <h4>이격거리</h4>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="55" />
          </div>
        </div>
        <div class="rows">
          <label class="row opt-pill"><input type="checkbox" class="opt" value="residential" data-color="--c-buffer-1">주거</label>
          <label class="row opt-pill"><input type="checkbox" class="opt" value="road"        data-color="--c-buffer-2">도로</label>
        </div>
      </section>

      <!-- 11. 계통 -->
      <section class="card sec" data-key="grid">
        <div class="card-head">
          <label class="title-check">
            <input type="checkbox" class="section-toggle">
            <span>계통</span>
          </label>
          <div class="controls">
            <label class="opacity-label">투명도</label>
            <input class="range op" type="range" min="0" max="100" value="55" />
          </div>
        </div>
      </section>
    </aside>

    <!-- Map -->
    <section class="map-wrap">
      <div id="map" class="map-canvas"></div>

      <!-- Floating controls -->
      <div class="map-controls">
        <div class="ctrl-stack">
          <button id="btnZoomIn"  class="ctrl">＋</button>
          <button id="btnZoomOut" class="ctrl">－</button>
          <button id="btnLocate"  class="ctrl">📍</button>
        </div>
        <button id="btnPrimaryCTA" class="fab">
          <img class="fab-icon" src="https://unpkg.com/lucide-static@0.447.0/icons/mouse-pointer-click.svg" alt="">
          선택 시작
        </button>
      </div>
    </section>
  </main>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>

<!-- VWorld API 키 템플릿 주입 -->
<script>
  window.VWORLD_API_KEY = "{{ VWORLD_API_KEY }}";
</script>

<!-- App JS -->
<script src="{% static 'main/script.js' %}"></script>
</body>
</html>
